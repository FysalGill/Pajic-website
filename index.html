<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJIC Holding — Technology Investment & Venture Building</title><meta name="description" content="PAJIC invests in and builds the technologies shaping tomorrow."><style>html,body{margin:0;background:#080808;color:#fff}#boot{min-height:100vh;display:grid;place-items:center;font:12px Arial;letter-spacing:2px;color:#e0c98c}#app{display:none}.v41 .hero h1{font-size:clamp(3rem,6.1vw,6.2rem)!important}.v41 .hero-content{padding:145px 0 90px!important}.v41 .portfolio-grid{grid-template-columns:1.2fr .9fr .9fr!important}.v41 .tech-map{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #2b2b2b;border-left:1px solid #2b2b2b;margin:40px 0 15px}.v41 .tech-map-card{min-height:205px;padding:24px;border-right:1px solid #2b2b2b;border-bottom:1px solid #2b2b2b;background:#0f0f0f}.v41 .tech-map-card span{color:#e0c98c;font-size:.63rem;letter-spacing:2px}.v41 .tech-map-card h3{font-size:1.2rem;margin:58px 0 7px}.v41 .tech-map-card p{color:#858585;font-size:.76rem;margin:0}.v41 .tech-map-card:hover{background:#171717;transform:translateY(-3px)}@media(max-width:900px){.v41 .tech-map{grid-template-columns:1fr 1fr!important}}@media(max-width:560px){.v41 .tech-map{grid-template-columns:1fr!important}.v41 .portfolio-card{min-height:290px}.v41 .portfolio-card h3{font-size:3rem}}
</style></head><body><div id="boot">LOADING PAJIC</div><div id="app"></div><script>
(async()=>{try{const u='https://raw.githubusercontent.com/FysalGill/Pajic-website/main/index.html';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);const t=await r.text(),d=new DOMParser().parseFromString(t,'text/html');document.querySelectorAll('body>style').forEach(x=>x.remove());document.head.insertAdjacentHTML('beforeend',d.head.querySelector('style')?.outerHTML||'');document.getElementById('app').innerHTML=d.body.innerHTML;document.body.classList.add('v41');document.getElementById('boot').remove();document.getElementById('app').style.display='block';
const map=document.createElement('div');map.className='tech-map';map.innerHTML='<div class="tech-map-card"><span>01</span><h3>Intelligence</h3><p>AI · Agents · Data · Software</p></div><div class="tech-map-card"><span>02</span><h3>Infrastructure</h3><p>Compute · Data Centres · Cybersecurity</p></div><div class="tech-map-card"><span>03</span><h3>Connectivity</h3><p>Satellite · Telecom · Networks</p></div><div class="tech-map-card"><span>04</span><h3>Physical Systems</h3><p>Robotics · Energy · DeepTech</p></div>';const sec=[...document.querySelectorAll('section')].find(s=>/Technology landscape|physical layer/i.test(s.textContent));if(sec){const old=sec.querySelector('.mosaic');if(old){map.querySelectorAll('.tech-map-card').forEach(x=>x.classList.add('reveal'));old.before(map)}const h=sec.querySelector('.section-title');if(h)h.textContent='The technology layers shaping the future.';const k=sec.querySelector('.kicker');if(k)k.textContent='PAJIC Technology Map'}
const p=document.querySelector('#portfolio .portfolio-grid');if(p&&p.children.length===2){const c=document.createElement('div');c.className='portfolio-card';c.innerHTML='<div class="portfolio-content"><span class="label">Future Investments</span><h3>Next.</h3><p>AI · Software · Data · Space · DeepTech</p></div>';p.appendChild(c);const lab=document.createElement('div');lab.className='portfolio-card';lab.innerHTML='<div class="portfolio-content"><span class="label">PAJIC AI Lab</span><h3>Lab.</h3><p>Venture building and pre-seed investment focused on high-potential AI businesses.</p></div>';p.children[1].replaceWith(lab)}
window.submitContact=e=>{e.preventDefault();const n=document.getElementById('name')?.value.trim()||'',m=document.getElementById('message')?.value.trim()||'',em=document.getElementById('email')?.value.trim()||'',c=document.getElementById('company')?.value.trim()||'',i=document.getElementById('interest')?.value||'';location.href='mailto:contact@pajic.ltd?subject='+encodeURIComponent('PAJIC website enquiry — '+i)+'&body='+encodeURIComponent('Name: '+n+'\nEmail: '+em+'\nCompany: '+c+'\nInterest: '+i+'\n\n'+m);return false};const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)x.target.classList.add('visible')}),{threshold:.08});document.querySelectorAll('section,.article,.thesis-card,.tech-map-card,.press-card,.contact-form').forEach(x=>{x.classList.add('reveal');io.observe(x)});
}catch(e){document.getElementById('boot').textContent='PAJIC — PLEASE REFRESH';console.error(e)}})();</script></body></html>
